<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF4F9A">
  <title>Register - DataVault</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-container animate-fade">
    <div style="position:absolute; top:20px; right:20px;">
      <button class="btn-icon theme-toggle-btn" title="Toggle Theme">🌙</button>
    </div>

    <div class="auth-brand">
      <img src="assets/logo.svg" alt="DataVault" class="auth-logo">
      <h1 class="auth-title">Create Your Vault</h1>
      <p class="auth-subtitle">Secure all your personal documents & media</p>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label class="form-label" for="regName">Full Name</label>
        <input type="text" id="regName" class="form-input" placeholder="Alex Morgan" required autocomplete="name">
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmail">Email Address</label>
        <input type="email" id="regEmail" class="form-input" placeholder="alex@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassword">Password</label>
        <input type="password" id="regPassword" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
      </div>

      <div class="form-group">
        <label class="form-label" for="regConfirmPassword">Confirm Password</label>
        <input type="password" id="regConfirmPassword" class="form-input" placeholder="Repeat password" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:12px;">
        Create My DataVault 🚀
      </button>
    </form>

    <div class="auth-footer-text">
      Already have a vault? <a href="login.html" class="font-bold">Sign In</a>
    </div>
  </div>

  <script type="module">
    import { registerUser } from './js/auth.js';
    import { showToast } from './js/ui.js';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      if (password !== confirmPassword) {
        showToast('Passwords do not match.', 'error');
        return;
      }

      if (password.length < 6) {
        showToast('Password must be at least 6 characters long.', 'error');
        return;
      }

      try {
        await registerUser(name, email, password);
        window.location.href = 'dashboard.html';
      } catch (err) {}
    });
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
