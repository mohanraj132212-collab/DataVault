<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4F9A" />
      <stop offset="100%" stop-color="#6C3BFF" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F8F7FB" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4F9A" />
      <stop offset="100%" stop-color="#FF8EB4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6C3BFF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Shield/Vault Body -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#vaultGrad)" filter="url(#shadow)" />

  <!-- Inner Vault Chamber Glass -->
  <rect x="80" y="80" width="352" height="352" rx="72" fill="#171522" opacity="0.25" />

  <!-- Layered Folder Cards inside Vault -->
  <rect x="136" y="160" width="240" height="170" rx="20" fill="url(#cardGrad)" transform="rotate(-6 256 245)" opacity="0.6" />
  <rect x="136" y="150" width="240" height="170" rx="20" fill="url(#cardGrad)" transform="rotate(4 256 235)" opacity="0.85" />
  <rect x="128" y="140" width="256" height="180" rx="24" fill="#FFFFFF" />

  <!-- Document Header lines on front card -->
  <rect x="160" y="172" width="72" height="12" rx="6" fill="url(#accentGrad)" />
  <rect x="160" y="196" width="150" height="8" rx="4" fill="#6C3BFF" opacity="0.4" />
  <rect x="160" y="214" width="120" height="8" rx="4" fill="#6C3BFF" opacity="0.25" />

  <!-- Central Security Lock Badge -->
  <circle cx="256" cy="336" r="64" fill="#171522" filter="url(#glow)" />
  <circle cx="256" cy="336" r="60" fill="url(#vaultGrad)" />

  <!-- Padlock Symbol -->
  <rect x="230" y="324" width="52" height="42" rx="10" fill="#FFFFFF" />
  <path d="M 240 324 V 306 A 16 16 0 0 1 272 306 V 324" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="342" r="5" fill="#6C3BFF" />
  <path d="M 256 347 V 356" stroke="#6C3BFF" stroke-width="4" stroke-linecap="round" />
</svg>
